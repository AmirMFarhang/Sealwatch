<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 262" width="960" height="262" role="img" aria-label="Authorize: how an agent payment is approved or refused"><title>Authorize: how an agent payment is approved or refused</title>
<style>
.card{fill:#f6f8fa;stroke:#d1d9e0;stroke-width:1}
.hero{fill:#fff8ee;stroke:#f7931a;stroke-width:1.4}
.opt{fill:#f6f8fa;stroke:#8c959f;stroke-width:1.2;stroke-dasharray:5 4}
